<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Police Alerts</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 600px; height: 600px;
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    width: 600px; height: 600px;
    display: none;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }
  #gate {
    width: 600px; height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    padding: 40px;
    box-sizing: border-box;
    text-align: center;
  }
  #gate-text {
    font-size: 20px;
    line-height: 1.5;
    color: #ddd;
  }
  #gate-start {
    border: 1px solid #ffb020;
    border-radius: 10px;
    padding: 16px 40px;
    font-size: 24px;
    font-weight: 600;
    color: #ffb020;
    background: #1a1200;
  }
  #header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
    margin-bottom: 14px;
  }
  #title {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #ffb020;
  }
  #status {
    font-size: 14px;
    color: #888;
  }
  #list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }
  .alert-row {
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0a0a0a;
  }
  .alert-row.selected {
    border-color: #ffb020;
    background: #1a1200;
  }
  .alert-main {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .alert-street {
    font-size: 22px;
    font-weight: 600;
  }
  .alert-city {
    font-size: 15px;
    color: #999;
  }
  .alert-side {
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .alert-distance {
    font-size: 26px;
    font-weight: 700;
    color: #ffb020;
  }
  .alert-bearing {
    font-size: 15px;
    color: #999;
  }
  .alert-age {
    font-size: 13px;
    color: #666;
  }
  #empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 20px;
    text-align: center;
  }
  #footer {
    border-top: 1px solid #333;
    padding-top: 8px;
    font-size: 13px;
    color: #555;
    text-align: center;
  }
  #notice {
    position: absolute;
    bottom: 44px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 15px;
    color: #cfa050;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  #notice.show {
    opacity: 1;
  }
</style>
</head>
<body>
<div id="gate">
  <div id="gate-text">By clicking Start, you acknowledge<br>you will not use this app while<br>operating any type of motorized vehicle.</div>
  <div id="gate-start">Start</div>
</div>

<div id="app">
  <div id="header">
    <div id="title">POLICE</div>
    <div id="status">locating…</div>
  </div>
  <div id="list"></div>
  <div id="notice"></div>
  <div id="footer">▲▼ select · Enter refresh</div>
</div>

<script>
  const BACKEND = 'https://YOUR-RENDER-APP.onrender.com'; // <-- set after deploying backend
  const RADIUS_KM = 8;
  const REGION = 'na'; // na | row | il
  const POLL_MS = 25000;
  const MAX_SHOWN = 4;
  const CLOSE_ALERT_KM = 1; // notify when a new alert is within this range
  const NOTICE_MS = 6000;

  let alerts = [];
  let selectedIndex = 0;
  let lastLat = null, lastLng = null;
  let watchId = null;
  let acknowledged = false;
  const seenAlertIds = new Set();

  const gateEl = document.getElementById('gate');
  const appEl = document.getElementById('app');
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('list');
  const noticeEl = document.getElementById('notice');
  let audioCtx = null;

  function playChime() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 660; // gentle, mid-range tone
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.05);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } catch (e) { /* audio not available, fail quietly */ }
  }

  function showNotice(text) {
    noticeEl.textContent = text;
    noticeEl.classList.add('show');
    clearTimeout(showNotice._t);
    showNotice._t = setTimeout(() => noticeEl.classList.remove('show'), NOTICE_MS);
  }

  function checkForNewCloseAlerts(list) {
    const newClose = list.filter(
      (a) => a.distanceKm <= CLOSE_ALERT_KM && !seenAlertIds.has(a.id)
    );
    list.forEach((a) => seenAlertIds.add(a.id));
    if (newClose.length) {
      const closest = newClose.sort((a, b) => a.distanceKm - b.distanceKm)[0];
      playChime();
      showNotice(`Police reported ${closest.distanceKm} km ${closest.bearing} — ${closest.street || 'nearby'}`);
    }
  }

  function fmtAge(mins) {
    if (mins === null || mins === undefined) return '';
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    return `${Math.round(mins / 60)}h ago`;
  }

  function render() {
    listEl.innerHTML = '';
    if (!alerts.length) {
      listEl.innerHTML = '<div id="empty">No police reports nearby</div>';
      return;
    }
    alerts.slice(0, MAX_SHOWN).forEach((a, i) => {
      const row = document.createElement('div');
      row.className = 'alert-row' + (i === selectedIndex ? ' selected' : '');
      row.innerHTML = `
        <div class="alert-main">
          <div class="alert-street">${a.street || a.subtype.replace('POLICE_', '').replace('_',' ')}</div>
          <div class="alert-city">${a.city || ''}</div>
        </div>
        <div class="alert-side">
          <div class="alert-distance">${a.distanceKm} km</div>
          <div class="alert-bearing">${a.bearing}</div>
          <div class="alert-age">${fmtAge(a.reportedMinutesAgo)}</div>
        </div>`;
      listEl.appendChild(row);
    });
  }

  async function fetchAlerts() {
    if (lastLat === null || lastLng === null) return;
    try {
      statusEl.textContent = 'updating…';
      const url = `${BACKEND}/alerts?lat=${lastLat}&lng=${lastLng}&radius_km=${RADIUS_KM}&region=${REGION}`;
      const res = await fetch(url);
      const data = await res.json();
      alerts = data.alerts || [];
      selectedIndex = 0;
      statusEl.textContent = `${alerts.length} nearby · updated`;
      checkForNewCloseAlerts(alerts);
      render();
    } catch (e) {
      statusEl.textContent = 'proxy error';
    }
  }

  function startLocationWatch() {
    if (!navigator.geolocation) {
      statusEl.textContent = 'no GPS available';
      return;
    }
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        lastLat = pos.coords.latitude;
        lastLng = pos.coords.longitude;
      },
      () => { statusEl.textContent = 'GPS denied'; },
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 }
    );
  }

  function beginApp() {
    gateEl.style.display = 'none';
    appEl.style.display = 'flex';
    startLocationWatch();
    setTimeout(fetchAlerts, 2000); // give GPS a moment to get a first fix
    setInterval(fetchAlerts, POLL_MS);
    render();
  }

  document.addEventListener('keydown', (e) => {
    if (!acknowledged) {
      if (e.key === 'Enter') {
        acknowledged = true;
        beginApp();
      }
      return;
    }
    if (e.key === 'ArrowUp') {
      selectedIndex = Math.max(0, selectedIndex - 1);
      render();
    } else if (e.key === 'ArrowDown') {
      selectedIndex = Math.min(Math.min(alerts.length, MAX_SHOWN) - 1, selectedIndex + 1);
      render();
    } else if (e.key === 'Enter') {
      fetchAlerts();
    }
  });

</script>
</body>
</html>
